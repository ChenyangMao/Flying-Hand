# Visual servo — simulation (red target). ROS 2 parameter file.
circle_detector:
  ros__parameters:
    image_topic: /uav1/camera/color/image_raw
    circle_topic: /detected_circle
    show_window: true
    desired_color: red

visual_servo_controller:
  ros__parameters:
    camera.fx: 744.96462268
    camera.fy: 753.64243411
    camera.cx: 512.0
    camera.cy: 384.0
    target_center_y: 205.0
    target_center_y_final: 205.0
    target_radius_pixel: 160.0
    target_radius_pixel_final: 175.0
    target_radius: 0.15
    target_x_bias: 0.0
