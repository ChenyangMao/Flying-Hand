# Gazebo-only overrides (control_stack_base loads pose + wrench gazebo YAML in ns wrench_controller).
# Keep simulation-specific force loop tuning here.

wrench_controller:
  ros__parameters:
    # Softer X force loop than bare wrench_px4_params if contact oscillates in Gazebo
    fx.P: 0.02
    fx.D: 0.01
    fx.min: -0.15
    fx.max: 0.15
