# Gazebo simulation overrides (loaded after wrench_px4_params.yaml).

wrench_controller:
  ros__parameters:
    thrust_max: 1.0
    hover_thrust: 0.58
    max_tilt: 45.0

    # Hybrid mix: lower pose weight on wall-normal so pose loop does not keep driving into the wall
    # after brief contact (matches control_stack_base tuning intent; sim may need <=0.6).
    mix_vel_x: 0.7
    mix_vel_y: 1.0
    mix_vel_z: 1.0

    # Same parameter as ROS1 control_stack_base (damps vz in force calculation).
    velx_damping_coefficient: 0.15

    # Enable force PID on sensor-X for wall-contact control.
    fx.P: 0.012
    fx.I: 0.09
    fx.D: 0.01
    fx.integral_threshold: 20.0
    fx.min: -0.8
    fx.max: 0.8

    # Reduce filter buffer to lower latency (10 samples @ 100 Hz = 100 ms).
    mean_filter_max_buffer_size: 10
    median_filter_max_buffer_size: 15
