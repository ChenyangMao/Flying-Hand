# Gazebo simulation overrides (loaded after wrench_px4_params.yaml).

wrench_controller:
  ros__parameters:
    thrust_max: 1.0
    hover_thrust: 0.58
    max_tilt: 45.0

    mix_vel_x: 0.0
    mix_vel_y: 1.0
    mix_vel_z: 1.0

    velx_damping_coefficient: 0.15

    visual_servo:
      kp: [0.10, 0.14, 0.0]
      ki: [0.0, 0.0, 0.0]
      max_body_velocity: [0.05, 0.06, 0.0]
      max_thrust_delta: [0.025, 0.03, 0.0]
      thrust_z_damping_coeff: 0.01
      cmd_alpha: 0.30
      enable_ramp_sec: 2.5
      depth_min: 0.85
      depth_max: 1.30
      timeout_sec: 1.5

    force_ff_coefficient: 0.010
    force_ff_coeffcient_bias: 0.003

    fx.P: 0.018
    fx.I: 0.008
    fx.D: 0.0
    fx.integral_threshold: 8.0
    fx.min: -0.8
    fx.max: 0.8

    x_hold.P: 0.06
    x_hold.D: 0.08

    median_filter_max_buffer_size: 7
    mean_filter_max_buffer_size: 5
