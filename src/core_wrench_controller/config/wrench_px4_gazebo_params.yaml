# Gazebo simulation overrides (loaded after wrench_px4_params.yaml).
#
# Wall contact: X axis is PURE force control (mix_vel_x=0 → position has no authority on X).
# Y/Z remain pure position control (mix_vel_y/z=1).

wrench_controller:
  ros__parameters:
    thrust_max: 1.0
    hover_thrust: 0.58

    # Pure force/position split: force owns X, position owns Y and Z.
    mix_vel_x: 0.0
    mix_vel_y: 1.0
    mix_vel_z: 1.0

    fx.P: 0.15
    fx.I: 0.008
    fx.D: 0.05
    fx.integral_threshold: 3.0
    fx.min: -0.40
    fx.max: 0.50

    pose_controller:
      P: [0.05, 0.10, 0.18]
      I: [0.03, 0.06, 0.05]
      D: [0.14, 0.14, 0.12]
      FF: [0.0, 0.0, 0.0]
      integral_threshold: [0.5, 0.5, 5.0]
      min: [-0.3, -0.3, -0.5]
      max: [0.3, 0.3, 0.5]
