# ROS2 parameters for WrenchControlNode (PX4-based UAV).
#
# Force loops: single-axis — only sensor X (wall normal / ft_setpoint.x). fy and fz P/I/D are 0.
# (control_stack_base defaults fz-only for “press along Z” missions; this repo’s wall tests use X.)
#
# Aligned with control_stack_base: ROS1 loads core_pose_controller/config/pose_px4_params.yaml
# into the wrench node; internal PoseController reads ~/pose_controller/P, I, D, ...
# Here the same data lives under wrench_controller.ros__parameters.pose_controller.* .

wrench_controller:
  ros__parameters:
    target_frame: "map"
    ft_sensor_frame: "ft_sensor"
    robot_frame: "base_link"
    world_frame: "map"
    contact_frame: "contact"

    # Geofence: ROS1 pose_px4_params used a small arena (e.g. z_max 1.8). Widen z_max if takeoff_alt > 1.8.
    geofence.enable: false
    geofence.x_min: -0.5
    geofence.x_max: 20.0
    geofence.y_min: -10.0
    geofence.y_max: 10.0
    geofence.z_min: 0.0
    geofence.z_max: 5.0

    # Motion/thrust limits passed into PoseController (ROS1 pose_px4_params.yaml)
    max_xy_vel: 3.0
    hover_thrust: 0.56
    thrust_min: 0.1
    thrust_max: 0.75
    max_tilt: 45.0

    # Internal PoseController gains (source of truth; C++ only uses YAML fallbacks if a key is absent)
    # Slightly lower P on X so pose loop does not fight wall normal force control as much.
    pose_controller:
      P: [0.09, 0.11, 0.25]
      I: [0.06, 0.07, 0.05]
      D: [0.15, 0.15, 0.1]
      FF: [0.0, 0.0, 0.0]
      integral_threshold: [0.5, 0.5, 5.0]
      min: [-0.3, -0.3, -0.5]
      max: [0.3, 0.3, 0.5]

    execute_target: 40.0

    fx.P: 0.0012
    fx.I: 0.009
    fx.D: 0.000
    fx.integral_threshold: 20.0
    fx.min: -0.8
    fx.max: 0.8

    # Contact-hold x-position damping inside wrench control.
    # This is a PD term on x position/velocity error, added only to wrench x.
    x_hold.P: 0.0
    x_hold.D: 0.0

    fy.P: 0.0
    fy.D: 0.0
    fy.min: -0.2
    fy.max: 0.2

    fz.P: 0.0
    fz.D: 0.0
    fz.min: -0.3
    fz.max: 0.3

    # Default (no external filter): controller subscribes to ft_data and publishes ft_data_filtered.
    # If you use an external filter (ft_data -> ft_data_filtered), override these at runtime:
    #   -p ft_data.input_topic:=ft_data_filtered -p ft_data.filter:=false -p ft_data.publish:=false
    ft_data.input_topic: "ft_data"
    ft_data.filter: true
    ft_data.publish: true

    median_filter_max_buffer_size: 20
    mean_filter_max_buffer_size: 20

    tactile.enable: false
    sensor_fusion: false

    force_ff_coefficient: 0.01591
    force_ff_coeffcient_bias: 0.04
